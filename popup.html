<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub_Frame</title>
</head>
<body>
<div>
    <h1>GitHub_Frame</h1>
</div>
<div>
    <div>미리보기</div>
    <div></div>
</div>
<div>
    <div>
        <label>사용하기</label>
        <label>
            <input type="checkbox">
            <span></span>
        </label>
    </div>
    <div>
        <label for="color">프레임 색상</label>
        <input type="color" id="color" value="#000000">
    </div>
    <div>
        <label for="width">두께 <span>1px</span></label>
        <input type="range" id="width" min="1" max="4" step="1" value="1">
    </div>
    <div>
        <label for="width2">번짐 정도 <span>1px</span></label>
        <input type="range" id="width2" min="1" max="4" step="1" value="1" />
    </div>
</div>
<div>
    <button>적용하기</button>
</div>
</body>
</html>
